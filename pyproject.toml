[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-devops-assistant"
version = "0.1.2"
description = "DevOps Assistant MCP Server for GitHub and Docker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp",
  "httpx",
  "docker",
  "python-dotenv",
]

[project.scripts]
mcp-devops-assistant = "devops_assistant.app:main"
devops-assistant = "devops_assistant.app:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: opt-in tests against authorized GitHub or Docker resources"]

[tool.setuptools.packages.find]
include = ["devops_assistant*"]
exclude = ["tests*"]
