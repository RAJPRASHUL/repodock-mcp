[project]
name = "mcp-devops-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastmcp",
  "httpx",
  "docker",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: opt-in tests against authorized GitHub or Docker resources"]

[tool.setuptools.packages.find]
include = ["devops_assistant*"]
exclude = ["tests*"]
